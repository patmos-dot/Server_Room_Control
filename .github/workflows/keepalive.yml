# Pings the database once a week so Supabase's free plan does not pause it
# during quiet weeks (holidays). Needs two repository secrets:
# SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (Settings > Secrets and variables > Actions).
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 * * 1,4'   # Mondays and Thursdays, 08:17 Kigali time
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail -sS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keepalive" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
